<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project 307 · File 004 Application</title>
<meta name="description" content="Apply to build your app or product with Project 307. File 004 is open.">
<style>
:root{--bg:#07080a;--card:#111317;--line:#262a31;--text:#eef0f3;--sub:#9aa1ab;--red:#FF4B3E;--gold:#F2C14E}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(120% 70% at 50% 0%,#17191f,#07080a 60%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:40px 16px 60px}
.lab{display:inline-flex;align-items:center;gap:10px;font:700 13px ui-monospace,Menlo,monospace;letter-spacing:.3em;border:1.5px solid #3a3f48;border-radius:10px;padding:8px 14px}
.lab i{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
h1{font-size:clamp(34px,8vw,52px);line-height:1.05;margin:22px 0 10px;letter-spacing:-.02em}h1 span{color:var(--gold)}
.lead{color:var(--sub);margin:0 0 28px}
form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
label{display:block;font-weight:600;margin:18px 0 6px}label:first-of-type{margin-top:0}label small{color:var(--sub);font-weight:400}
input,select,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0b0c0f;color:var(--text);font:inherit}
textarea{min-height:120px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:transparent}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-weight:400}.check input{width:auto;margin-top:4px}
button{margin-top:24px;width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(180deg,#FFD978,#E3AE3B);color:#1a1204;font:800 17px system-ui,sans-serif;letter-spacing:.06em;cursor:pointer}
.hp{position:absolute;left:-9999px}.foot{color:var(--sub);font-size:13px;text-align:center;margin-top:22px}
</style></head><body><div class="wrap">
<div class="lab"><i></i>PROJECT 307 · FILE 004</div>
<h1>File 004 is empty.<br><span>It could be yours.</span></h1>
<p class="lead">Got an app or product idea? Apply to build it with Project 307. We read every application.</p>
<form action="https://formsubmit.co/MWDBusiness@gmail.com" method="POST">
 <input type="hidden" name="_subject" value="New Project 307 File 004 application">
 <input type="hidden" name="_template" value="table">
 <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">
 <label for="n">Your name</label><input id="n" name="Name" required maxlength="80" autocomplete="name">
 <label for="e">Email</label><input id="e" name="email" type="email" required maxlength="120" autocomplete="email">
 <label for="ig">Instagram <small>(optional)</small></label><input id="ig" name="Instagram" maxlength="40" placeholder="@yourhandle">
 <label for="t">What do you want to build?</label>
 <select id="t" name="Type" required><option value="">Choose one</option><option>Mobile app</option><option>Web app / website</option><option>Physical product</option><option>Something else</option></select>
 <label for="i">Your idea <small>(what it does and who it's for)</small></label><textarea id="i" name="Idea" required maxlength="2000"></textarea>
 <label for="s">How far along are you?</label>
 <select id="s" name="Stage" required><option value="">Choose one</option><option>Just an idea</option><option>Sketches / plan</option><option>Started building</option><option>Already launched</option></select>
 <label for="w">When do you want it ready?</label>
 <select id="w" name="Timeline"><option>No rush</option><option>1-3 months</option><option>3-6 months</option><option>ASAP</option></select>
 <label for="l">Link <small>(optional: website, deck, sketch)</small></label><input id="l" name="Link" type="url" maxlength="300" placeholder="https://">
 <label class="check"><input type="checkbox" name="Agreed to be contacted" value="Yes" required> I'm happy for Project 307 to contact me about my idea.</label>
 <button type="submit">SEND MY APPLICATION</button>
</form>
<p class="foot">DM @project307am with any questions.</p>
</div></body></html>
